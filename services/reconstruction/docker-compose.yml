services:
  gateway:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HUNYUAN_URL: http://host.docker.internal:8081
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      API_TOKEN: ${API_TOKEN:-}
      MIRRAI_ENV: ${MIRRAI_ENV:-production}
      MAX_UPLOAD_BYTES: 20971520
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      MAX_PENDING_JOBS: ${MAX_PENDING_JOBS:-8}
      ASSET_TTL_HOURS: ${ASSET_TTL_HOURS:-72}
    volumes:
      - mirrai-assets:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mirrai-assets:

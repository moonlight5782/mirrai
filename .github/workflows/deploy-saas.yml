name: Deploy MIRRAI SaaS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirrai-saas-staging
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: python -m unittest discover -s services/reconstruction -p "test_*.py"
      - run: npm test

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mirrai-staging
    env:
      MIRRAI_DEPLOY_ENV: staging
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      MIRRAI_D1_DATABASE_ID: ${{ vars.MIRRAI_D1_DATABASE_ID }}
      MIRRAI_STORAGE_MODE: ${{ vars.MIRRAI_STORAGE_MODE }}
      MIRRAI_KV_NAMESPACE_ID: ${{ vars.MIRRAI_KV_NAMESPACE_ID }}
      MIRRAI_R2_BUCKET_NAME: ${{ vars.MIRRAI_R2_BUCKET_NAME }}
      MIRRAI_APP_ORIGIN: ${{ vars.MIRRAI_APP_ORIGIN }}
      MIRRAI_OPERATOR_EMAIL: ${{ vars.MIRRAI_OPERATOR_EMAIL }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy app, database migrations and configured secrets
        run: npm run deploy:saas
